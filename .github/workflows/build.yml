name: build

on:
  pull_request:
    branches: [main, next]
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  python:
    # windows-latest: the plug-in suite has only ever run on Windows, and the sibling repos'
    # suites (Inkscape NI-00000439, OpenOffice NI-00000440) turned out path-case-broken on
    # Linux. Prove this one on ubuntu deliberately before moving it.
    runs-on: windows-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run the plug-in's tests
        run: python -m pytest tests/ -q

  manifest:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Add the Nexus-PLM package feed
        run: >
          dotnet nuget add source "https://nuget.pkg.github.com/Nexus-PLM/index.json"
          --name nexus-plm
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_READ_TOKEN || secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
      - name: Validate the translator manifest
        run: dotnet test Nexus.PLM.Gimp.Translators.Tests/Nexus.PLM.Gimp.Translators.Tests.csproj -c Release

  # A v* tag attaches the translators deliverable: the manifest + the script-fu export script.
  release-translators:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the manifest deliverable
        run: |
          test -f translators/translators.json
          test -f translators/xcf_export.scm
          ! ls translators/*.dll 2>/dev/null
          (cd translators && zip -qr ../Nexus.PLM.Gimp.Translators.zip .)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --notes "GIMP add-in release ${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" Nexus.PLM.Gimp.Translators.zip --clobber
